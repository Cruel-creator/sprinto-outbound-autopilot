<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#f8fafc;color:#111827;font:14px/1.45 Geist,sans-serif}
aside{position:fixed;left:0;top:0;bottom:0;width:220px;background:#fff;border-right:1px solid #e5e7eb;padding:20px}aside b{display:block;margin-bottom:24px}aside a{display:block;padding:8px 10px;border-radius:6px;color:#4b5563}aside a.on{background:#eff6ff;color:#2563eb}
main{margin-left:220px;padding:24px 32px;display:grid;gap:16px}
.top{display:flex;gap:8px}.top input{flex:1;height:38px;border:1px solid #e5e7eb;border-radius:8px;padding:0 12px}.top button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:0 16px}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.k div{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px}.k b{font-size:28px;display:block}.k span{color:#6b7280}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.c{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px}
.bar{height:26px;background:#2563eb;border-radius:4px;margin:8px 0;color:#fff;padding-left:8px;font-size:12px;line-height:26px}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #f1f5f9;text-align:left}th{color:#6b7280;font-weight:500}
</style></head><body>
<aside><b>Sprinto Outbound</b><a class="on">Dashboard</a><a>Accounts</a><a>Pipeline</a><a>Settings</a></aside>
<main><div class="top"><input placeholder="Add domains to research"><button>Research &amp; send</button></div>
<div class="k"><div><b>10</b><span>Accounts</span></div><div><b>3</b><span>Qualified</span></div><div><b>2</b><span>Emails sent</span></div><div><b>11s</b><span>Per account</span></div></div>
<div class="two"><div class="c"><b>Funnel</b><div class="bar" style="width:100%">10 researched</div><div class="bar" style="width:30%">3 qualified</div><div class="bar" style="width:20%">2 sent</div></div>
<div class="c"><b>Email quality</b><p style="color:#6b7280;margin-top:8px">Average reviewer score 3.9 / 10</p></div></div>
<div class="c"><table><tr><th>Account</th><th>Status</th><th>Score</th><th>Contact</th></tr><tr><td>Nurix AI</td><td>Sent</td><td>66</td><td>Mukesh Bansal</td></tr><tr><td>Bolna AI</td><td>Sent</td><td>62</td><td>Prateek Sachan</td></tr><tr><td>Atomicwork</td><td>Held</td><td>64</td><td>Kiran Darisi</td></tr></table></div>
</main></body></html>
